<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altaran</title>
<meta name="description" content="Altaran. Intelligence for modern markets.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' fill='%23d8c9a7'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --ink: #ece8df;
    --muted: #8a867d;
    --gold: #d8c9a7;
    --line: rgba(236, 232, 223, .12);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 50% 45%, rgba(216, 201, 167, .06), transparent 70%),
      radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, .75) 100%);
  }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 48px;
  }

  .top, .bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 0;
  }

  .mark {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 300;
    font-size: clamp(56px, 11vw, 132px);
    letter-spacing: .14em;
    line-height: 1;
    margin: 0 0 0 .14em;
    text-transform: uppercase;
    opacity: 0;
    animation: rise 1.8s cubic-bezier(.2, .7, .1, 1) .2s forwards;
  }

  .rule {
    width: 0;
    height: 1px;
    background: var(--gold);
    margin: 36px 0 30px;
    opacity: .7;
    animation: draw 1.6s cubic-bezier(.6, 0, .2, 1) 1s forwards;
  }

  .tagline {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(20px, 2.4vw, 26px);
    color: var(--gold);
    margin: 0;
    opacity: 0;
    animation: fade 1.6s ease 1.6s forwards;
  }

  a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color .3s ease, border-color .3s ease;
  }
  a:hover { color: var(--ink); border-color: var(--line); }

  .top, .bottom { opacity: 0; animation: fade 1.6s ease 2s forwards; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  @keyframes draw { to { width: 72px; } }
  @keyframes fade { to { opacity: 1; } }

  @media (max-width: 600px) {
    .page { padding: 24px 16px; }
    .top, .bottom { font-size: 10px; letter-spacing: .2em; }
    .bottom { flex-direction: column-reverse; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark, .tagline, .top, .bottom { animation: none; opacity: 1; }
    .rule { animation: none; width: 72px; }
  }
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="page">
  <div class="top">
    <span>Altaran</span>
    <span>Est. 2026</span>
  </div>

  <main class="center">
    <h1 class="mark">Altaran</h1>
    <div class="rule"></div>
    <p class="tagline">Intelligence for modern markets.</p>
  </main>

  <div class="bottom">
    <span>&copy; 2026 Altaran</span>
    <a href="mailto:hello@altaran.xyz">hello@altaran.xyz</a>
  </div>
</div>

<script>
  (function () {
    var canvas = document.getElementById("field");
    var ctx = canvas.getContext("2d");
    var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var w, h, dpr, lines;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      lines = Math.max(18, Math.round(h / 26));
    }

    function draw(t) {
      ctx.clearRect(0, 0, w, h);
      var gap = h / (lines + 1);
      for (var i = 1; i <= lines; i++) {
        var y0 = i * gap;
        var phase = i * 0.37;
        var dist = Math.abs(i - (lines + 1) / 2) / ((lines + 1) / 2);
        var alpha = 0.045 + 0.075 * (1 - dist);
        ctx.beginPath();
        for (var x = -10; x <= w + 10; x += 8) {
          var u = x / w;
          var env = Math.sin(Math.PI * u);
          var y = y0
            + env * 18 * Math.sin(u * 5.2 + t * 0.00018 + phase)
            + env * 9 * Math.sin(u * 11.7 - t * 0.00011 + phase * 1.9)
            + env * 4 * Math.sin(u * 23.3 + t * 0.00025 + phase * 0.6);
          if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = "rgba(216, 201, 167, " + alpha.toFixed(3) + ")";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function frame(t) {
      draw(t);
      requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener("resize", function () { resize(); if (still) draw(0); });
    if (still) draw(0); else requestAnimationFrame(frame);
  })();
</script>

</body>
</html>
